<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form — Dev Harness</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #F8FAFC; margin: 0; padding: 2rem 1rem; color: #0F172A; }
      .form-control { display: block; width: 100%; padding: .625rem .875rem; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .15s; }
      .form-control:focus { border-color: #0D9488; }
      .form-group { margin-bottom: 1.125rem; }
      .form-label { display: block; font-weight: 600; font-size: .875rem; color: #374151; margin-bottom: .375rem; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .625rem 1.25rem; border-radius: 8px; font-weight: 600; font-size: .9rem; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
      .btn--primary { background: #0D9488; color: #fff; border-color: #0D9488; }
      .btn--primary:hover { background: #115E59; border-color: #115E59; }
      .btn--outline { background: transparent; color: #0D9488; border-color: #0D9488; }
      .btn--outline:hover { background: #F0FDFA; }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      .popia-block { background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 8px; padding: 1rem; }
      .skeleton { background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      .harness-badge { display: inline-block; background: #FEF3C7; color: #92400E; font-size: .7rem; font-weight: 700; padding: .2rem .6rem; border-radius: 20px; margin-bottom: 1.5rem; }
    </style>
    <!-- Simulate awsisaReg global that WordPress would inject -->
    <script>
      window.awsisaReg = {
        supabaseUrl:  'https://placeholder.supabase.co',
        supabaseKey:  'placeholder-key',
        restUrl:      'http://localhost:8080/wp-json/awsisa/v1',
        nonce:        'dev-nonce',
        successUrl:   '/register/success/',
        privacyUrl:   '/privacy-policy/',
        pricing: {
          government:     { zar: 4500,  usd: 245 },
          utility:        { zar: 4500,  usd: 245 },
          private_sector: { zar: 8500,  usd: 465 },
          ngo:            { zar: 3500,  usd: 190 },
          academic:       { zar: 2500,  usd: 135 },
          media:          { zar: 0,     usd: 0   },
          exhibitor:      { zar: 12000, usd: 655 },
          sponsor:        { zar: 0,     usd: 0   },
        }
      }
    </script>
  </head>
  <body>
    <div style="max-width: 720px; margin: 0 auto;">
      <span class="harness-badge">⚙️ Dev Harness — not WordPress</span>
      <div id="registration-app"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
